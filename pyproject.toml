[project]
name = "pyogmios"
version = "0.7.4"
description = "Python client for Ogmios, the WebSocket JSON-RPC bridge to cardano-node"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hareem Adderley", email = "hadderley@kingpinapps.com" }]
requires-python = ">=3.11"
keywords = ["cardano", "ogmios", "blockchain", "json-rpc", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.12",
    "nanoid>=2.0",
    "promise>=2.3",
    "pydantic>=2.11",
    "typing-extensions>=4.12",
    "websocket-client>=1.8",
]

[project.urls]
Homepage = "https://github.com/Kingpin-Apps/pyogmios"
Source = "https://github.com/Kingpin-Apps/pyogmios"
Issues = "https://github.com/Kingpin-Apps/pyogmios/issues"
Changelog = "https://github.com/Kingpin-Apps/pyogmios/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "commitizen>=4.8",
    "datamodel-code-generator>=0.34",
    "pre-commit>=4.3",
    "websockets>=15",
]
lint = [
    "ruff>=0.14",
    "ty>=0.0.90",
]
test = [
    "faker>=37",
    "jsonschema>=4.25",
    "polyfactory>=2.22",
    "pyee>=13",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7",
    "pytest-mock>=3.15",
]
docs = [
    "mike>=2.1",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: needs a live Ogmios server (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["pyogmios"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["E501"]

# Temporary: legacy v5/v6 code that Phases 2-6 of the v7 upgrade replace. Remove each entry as its code is rewritten.
[tool.ruff.lint.per-file-ignores]
"src/pyogmios/models/__init__.py" = ["UP007", "F821"]
"src/pyogmios/ouroboros_mini_protocols/tx_submission/*_errors.py" = ["UP007"]
"tests/**" = ["PT012"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
legacy_tag_formats = ["$version"]
update_changelog_on_bump = true
major_version_zero = true
version_files = ["src/pyogmios/__init__.py:__version__"]

# Model generation (`just regen-models`): scripts/generate.py passes --input and --output.
[tool.datamodel-codegen]
input-file-type = "jsonschema"
preset = "standard-py311-20261017"
collapse-root-models = false
use-type-alias-type = true
enum-field-as-literal = "all"
use-tag-as-union-variant-name = true
snake-case-field = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
