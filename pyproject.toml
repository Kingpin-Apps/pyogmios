[project]
name = "pyogmios"
version = "0.7.4"
description = "Python client for Ogmios, the WebSocket JSON-RPC bridge to cardano-node"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hareem Adderley", email = "hadderley@kingpinapps.com" }]
requires-python = ">=3.11"
keywords = ["cardano", "ogmios", "blockchain", "json-rpc", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.11",
    "typing-extensions>=4.12",
    "websockets>=15",
]

[project.optional-dependencies]
# Faster JSON encoding and decoding; used automatically when installed.
speedups = ["orjson>=3.10"]

[project.scripts]
pyogmios = "pyogmios.cli:main"

[project.urls]
Homepage = "https://github.com/Kingpin-Apps/pyogmios"
Source = "https://github.com/Kingpin-Apps/pyogmios"
Issues = "https://github.com/Kingpin-Apps/pyogmios/issues"
Changelog = "https://github.com/Kingpin-Apps/pyogmios/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "commitizen>=4.8",
    "datamodel-code-generator>=0.34",
    "pre-commit>=4.3",
]
lint = [
    "ruff>=0.14",
    "ty>=0.0.90",
]
test = [
    "cbor2>=5.6",
    "hypothesis>=6.170",
    "hypothesis-jsonschema>=0.23",
    "jsonschema>=4.25",
    "pynacl>=1.5",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7",
    "pytest-xdist>=3.8",
]
docs = [
    # MkDocs 2.0 drops plugins and themes; Material and mkdocstrings need 1.x.
    "mkdocs>=1.6,<2",
    "mike>=2.1",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
# Every warning fails the test that raised it: deprecations and resource leaks are caught early.
filterwarnings = ["error"]
markers = [
    "integration: needs a live Ogmios server (deselect with '-m \"not integration\"')",
    "devnet: needs the local devnet (just devnet-up), whose keys it signs transactions with",
    "properties: property-based tests over every type; slow (just test-properties)",
]

[tool.coverage.run]
source = ["pyogmios"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
# ASYNC109: a per-call `timeout` parameter is deliberate API, as in httpx.
ignore = ["E501", "ASYNC109"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
legacy_tag_formats = ["$version"]
update_changelog_on_bump = true
major_version_zero = true
version_files = ["src/pyogmios/__init__.py:__version__"]

# Model generation (`just regen-models`): scripts/generate.py passes --input and --output.
[tool.datamodel-codegen]
input-file-type = "jsonschema"
preset = "standard-py311-20261017"
collapse-root-models = false
use-type-alias-type = true
enum-field-as-literal = "all"
use-tag-as-union-variant-name = true
snake-case-field = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
